[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-bi"
version = "0.1.0"
description = "Answers policy questions from your own documents with page-level citations, and says when they do not cover a question"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyPDF2>=3.0.1,<4.0",
  "google-generativeai>=0.8.5,<2.0",
  "chromadb>=1.5.8,<2.0",
  "tenacity>=8.2,<9.0",
  "filelock>=3.13,<4.0",
  "tiktoken>=0.6,<1.0",
  "pdfplumber>=0.11.4,<0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pdfminer.six>=20221105"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
api = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn>=0.30,<1.0",
]
auth = [
  "Authlib>=1.3,<2.0",
]
export = [
  "weasyprint>=62,<64",
  "python-pptx>=0.6.23,<1.0",
]
formats = [
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
]

[project.scripts]
bi-rag = "true_rag_bi.cli:main"
grounded-bi = "true_rag_bi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
